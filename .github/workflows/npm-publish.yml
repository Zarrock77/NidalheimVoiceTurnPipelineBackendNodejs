name: Publish to npm

on:
  release:
    types: [published]
  pull_request:
    paths:
      - .github/workflows/npm-publish.yml
      - package.json
      - pnpm-lock.yaml
      - src/**
      - tsconfig.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate npm package
    if: github.event_name != 'release' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Validate release version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const { version } = JSON.parse(readFileSync("package.json", "utf8"));
          const tag = process.env.RELEASE_TAG;
          if (!/^v\d+\.\d+\.\d+$/.test(tag) || tag !== `v${version}`) {
            throw new Error(`Release tag ${tag} must match stable package version v${version}`);
          }
          NODE

      - run: npm install --global npm@11.9.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build
      - name: Pack the distribution
        run: |
          mkdir -p "$RUNNER_TEMP/npm-package"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/npm-package"

      - name: Smoke-test the installed distribution
        run: |
          consumer_dir="$(mktemp -d)"
          cd "$consumer_dir"
          npm init --yes > /dev/null
          npm install --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP"/npm-package/*.tgz
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import * as pkg from "nidalheim-voice-turn-pipeline";
          for (const name of ["VoiceTurnSession", "SpeechTurn", "DeepgramStreamingSTT", "CartesiaStreamingTTS", "ElevenLabsStreamingTTS"]) {
            assert.equal(typeof pkg[name], "function", name);
          }
          console.log("Clean consumer import: all five public constructors available.");
          NODE

      - name: Keep the validated package for publication
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-package/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish validated package
    needs: validate
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.9.0
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-package
      - name: Publish with npm trusted publishing
        run: npm publish "$RUNNER_TEMP"/npm-package/*.tgz --access public --registry=https://registry.npmjs.org/
