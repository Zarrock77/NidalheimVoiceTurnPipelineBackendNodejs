version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # CI runs Node 22 and publishing Node 24: stay on matching type definitions.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Major migration tracked in #24 (API rewrite, needs a real audio stream).
      - dependency-name: "@deepgram/sdk"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
